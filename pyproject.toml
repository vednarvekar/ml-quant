[project]
name = "mlq"
version = "0.0.1"
description = "ml-quant: research + data pipeline for NSE trading"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27",
  "lightgbm>=4.7.0",
  "numpy>=2.4.6",
  "polars>=1.0",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "scikit-learn>=1.9.1",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
